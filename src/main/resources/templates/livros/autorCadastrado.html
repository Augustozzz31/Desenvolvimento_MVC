<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autor cadastrado</title>
</head>
<body>

<h1>Autor cadastrado com sucesso!</h1>

<p>
    <strong>Autor:</strong>
    <span th:text="${autor}"></span>
</p>

<p>
    <strong>Nacionalidade:</strong>
    <span th:text="${nacionalidade}"></span>
</p>

<p>
    <strong>Quantidade de livros publicados:</strong>
    <span th:text="${quantidadeLivros}"></span>
</p>


<a th:href="@{/livros/cadastroAutor}">Cadastrar outro autor</a>
<button type="button" onclick="window.location.href='/livros'">Voltar ao início</button>

</body>
</html>
