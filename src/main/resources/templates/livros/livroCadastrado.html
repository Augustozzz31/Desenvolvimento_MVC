<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livro cadastrado</title>
</head>
<body>

<h1>Livro cadastrado com sucesso!</h1>

<p>
    <strong>Título:</strong>
    <span th:text="${titulo}"></span>
</p>

<p>
    <strong>Autor:</strong>
    <span th:text="${autor}"></span>
</p>

<p>
    <strong>ISBN:</strong>
    <span th:text="${isbn}"></span>
</p>

<a href="/livros/cadastroLivro">Cadastrar outro livro</a>
<button type="button" onclick="window.location.href='/livros'">Voltar ao início</button>

</body>
</html>
