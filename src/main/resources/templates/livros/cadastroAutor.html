<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Autor</title>
</head>
<body>

<h1>Cadastro de Livros</h1>

<form action="/livros/autorCadastrado" method="post">
    <label for="autor">Nome do autor:</label>
    <input type="text" id="autor" name="autor" required>

    <br><br>

    <label for="nacionalidade">Nacionalidade:</label>
    <input type="text" id="nacionalidade" name="nacionalidade" required>

    <br><br>

    <label for="quantidadeLivros">Quantidade de livros publicados:</label>
    <input type="number" id="quantidadeLivros" name="quantidadeLivros" min="0" required>

    <br><br>

    <button type="submit">Cadastrar autor</button>
    <button type="reset">Limpar</button>
    <button type="button" onclick="window.location.href='/livros'">Voltar ao início</button>
</form>

</body>
</html>
