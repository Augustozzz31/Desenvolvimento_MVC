<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros cadastrados</title>
</head>
<body>

<h1>Livros Cadastrados</h1>

<ul>
    <li th:each="livro : ${livros}">

        <form th:action="@{/livros/editarLivro}" method="post">

            <input type="hidden" name="id" th:value="${livro.id}">

            <label>Título:</label>
            <input type="text" name="titulo" th:value="${livro.titulo}" required>

            <label>Autor:</label>
            <input type="text" name="autor" th:value="${livro.autor}" required>

            <label>ISBN:</label>
            <input type="text" name="isbn" th:value="${livro.isbn}" required>

            <button type="submit">Salvar alterações</button>
        </form>

        <form th:action="@{/livros/excluirLivro}" method="post">
            <input type="hidden" name="id" th:value="${livro.id}">
            <button type="submit">Excluir livro</button>
        </form>

        <hr>

    </li>
</ul>

<button type="button" onclick="window.location.href='/livros'">
    Voltar ao início
</button>

</body>
</html>
